name: Monitoreo BTS
on:
  schedule:
    - cron: '*/5 * * * *' # Se ejecuta automáticamente cada 5 minutos
  workflow_dispatch: # Permite ejecutarlo manualmente desde la web de GitHub cuando quieras

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Copiar repositorio
        uses: actions/checkout@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install

      - name: Instalar dependencias de Playwright
        run: npx playwright install --with-deps

      - name: Ejecutar bot
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: node bot.js
